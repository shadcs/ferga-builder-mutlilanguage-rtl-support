name: Feature request
description: Suggest a block, template or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the page you are trying to build.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Ferga-Builder help?
